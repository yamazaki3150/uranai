
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日のあなたの運勢診断</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <main class="container">
    <div class="moon">☾</div>

    <h1>今日の運勢診断</h1>
    <p class="subtitle">✨ 今日のあなたの運勢を占います ✨</p>

    <div class="stars">★　✦　★　✧　★</div>

    <p class="question">あなたの名前を入力してください</p>

    <input
      type="text"
      id="user-name"
      maxlength="20"
      placeholder="例：たろう"
    >

    <button id="assessment">運勢を占う ✨</button>

    <div id="result-area" aria-live="polite"></div>

    <p class="footer">今日も素敵な1日になりますように 🌙</p>
  </main>

  <script src="./script.js"></script>
</body>
</html>
